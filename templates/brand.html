{% macro glyph(class_name='glyph-mark shrink-0', size=38, gradient_id='logoGrad') -%}
<svg class="{{ class_name }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="{{ gradient_id }}" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93e2ff"/>
      <stop offset="1" stop-color="#e0b6ff"/>
    </linearGradient>
  </defs>
  <polygon pathLength="1" points="20,3 34,11.5 34,28.5 20,37 6,28.5 6,11.5" fill="none" stroke="url(#{{ gradient_id }})" stroke-width="2.2"/>
  <g stroke="url(#{{ gradient_id }})" stroke-width="1.4" opacity="0.55">
    <line x1="20" y1="3" x2="20" y2="7"/>
    <line x1="34" y1="11.5" x2="30.5" y2="13.5"/>
    <line x1="34" y1="28.5" x2="30.5" y2="26.5"/>
    <line x1="20" y1="37" x2="20" y2="33"/>
    <line x1="6" y1="28.5" x2="9.5" y2="26.5"/>
    <line x1="6" y1="11.5" x2="9.5" y2="13.5"/>
  </g>
  <path pathLength="1" d="M13 24 L20 15 L27 22" fill="none" stroke="#f72585" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="13" cy="24" r="2.6" fill="#4cc9f0"/>
  <circle cx="20" cy="15" r="2.6" fill="#e5e2e1"/>
  <circle cx="27" cy="22" r="2.6" fill="#f72585"/>
</svg>
{%- endmacro %}
